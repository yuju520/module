name: 微博跳转
description: 将微博网页链接重定向到你选择的客户端（Lolipop / VVebo / 原版）
author: 雪允
icon: https://iili.io/CQstj7p.png
env_schema:
  CLIENT:
    name: 微博客户端
    description: 选择要跳转到的微博客户端
    default_value: 原版微博
    options:
    - 原版微博
    - Lolipop
    - VVebo
dns: {}
scriptings:
- http_request:
    name: 微博链接重定向
    match: ^https?://((www\.)?weibo\.com|(www\.)?weibo\.cn|m\.weibo\.cn|s\.weibo\.com)/.+
    # 本地导入时请改为你自己托管的 WbRedirect.js 地址，或使用下方 inline 方式
    script_url: https://raw.githubusercontent.com/yuju520/module/refs/heads/main/WbRedirect.js
    timeout: 10
mitm:
  hostnames:
  - weibo.com
  - www.weibo.com
  - weibo.cn
  - www.weibo.cn
  - m.weibo.cn
  - s.weibo.com
  - c.weibo.cn
